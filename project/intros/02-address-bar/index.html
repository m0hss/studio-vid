<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Intro 2 — The Address Bar</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="_shared/intro.css" />
    <style>
      #s2 { background: radial-gradient(70% 60% at 50% 110%, rgba(20,184,166,0.16), transparent 70%), #000; }
      #cam { position: absolute; inset: 0; }
      /* a neutral, unbranded browser window */
      #win { position: absolute; left: 220px; top: 110px; width: 1480px; height: 860px; border-radius: 18px; overflow: hidden; background: #0c0c0c;
        box-shadow: 0 0 0 1.5px #262626, 0 60px 160px rgba(0,0,0,0.8); }
      #bar { position: absolute; left: 0; right: 0; top: 0; height: 84px; background: #161616; border-bottom: 1.5px solid #232323; }
      .dot { position: absolute; top: 34px; width: 16px; height: 16px; border-radius: 50%; background: #333; }
      .ico { position: absolute; top: 26px; width: 32px; height: 32px; }
      #field { position: absolute; left: 300px; right: 120px; top: 18px; height: 48px; border-radius: 999px; background: #0b0b0b; box-shadow: 0 0 0 1.5px #2a2a2a;
        display: flex; align-items: center; padding-left: 26px; font: 500 24px/1 var(--body); color: var(--white); white-space: nowrap; }
      #ph { position: absolute; left: 26px; color: #6b6b6b; }
      #urlSel .hl { top: -0.12em; bottom: -0.16em; }
      #prog { position: absolute; left: 0; top: 84px; height: 3px; width: 100%; background: var(--glow); transform-origin: 0 50%; box-shadow: 0 0 12px var(--glow); }
      #page { position: absolute; left: 0; right: 0; top: 86px; bottom: 0; }
      #err { position: absolute; left: 0; right: 0; top: 250px; text-align: center; opacity: 0; }
      #err .t { margin-top: 34px; font: 600 46px/1.1 var(--body); color: #d8d8d8; }
      #err .s { margin-top: 16px; font: 400 26px/1.4 var(--body); color: #7d7d7d; }
      #err .c { margin-top: 26px; font: 400 20px/1 var(--mono); letter-spacing: 0.06em; color: #555; }
      #lines { position: absolute; left: 0; right: 0; top: 270px; display: flex; flex-direction: column; align-items: center; }
      #lines .ln { font: 500 96px/1.08 var(--display); letter-spacing: -0.035em; color: var(--white); }
      #lines #m2 { color: #8a8a8a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <section id="s2" class="clip" data-start="0" data-duration="8.1" data-track-index="1">
        <div id="cam">
          <div id="win">
            <div id="bar">
              <div class="dot" style="left:28px"></div><div class="dot" style="left:56px"></div><div class="dot" style="left:84px"></div>
              <svg class="ico" style="left:134px" viewBox="0 0 32 32"><path d="M19 8l-8 8 8 8" fill="none" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="ico" style="left:180px" viewBox="0 0 32 32"><path d="M13 8l8 8-8 8" fill="none" stroke="#4a4a4a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="ico" id="reload" style="left:228px" viewBox="0 0 32 32"><path d="M24.5 16a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round"/><path d="M23.5 5.5v5h-5" fill="none" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div id="field"><span id="ph">Search or enter an address</span><span class="sel" id="urlSel"><span class="hl"></span><span class="tx" id="url"></span></span></div>
            </div>
            <div id="prog"></div>
            <div id="page">
              <div id="err">
                <svg width="120" height="140" viewBox="0 0 120 140"><path d="M14 6h64l28 28v100H14z" fill="none" stroke="#4d4d4d" stroke-width="5" stroke-linejoin="round"/><path d="M78 6v28h28" fill="none" stroke="#4d4d4d" stroke-width="5" stroke-linejoin="round"/><path d="M44 72l32 32M76 72l-32 32" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/></svg>
                <div class="t">Server not found</div>
                <div class="s">Nothing answers at rosas.be.</div>
                <div class="c">ERR_NAME_NOT_RESOLVED</div>
              </div>
              <div id="lines">
                <div class="ln" id="m1"><span>Rosa's has been open for years.</span></div>
                <div class="ln" id="m2"><span>Online, it doesn't exist.</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="flood" id="flood"></div>
      </section>
      <section id="tail" class="clip" data-start="7.98" data-duration="2.02" data-track-index="2"></section>
      <div id="grain"></div>
      <audio id="sfx" src="sfx.wav" data-start="0" data-duration="10" data-track-index="0" data-volume="1"></audio>
    </div>
    <script src="_shared/intro.js"></script>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const { E } = IK;
        const f = document.getElementById("field").getBoundingClientRect();
        // open tight on the empty address field, cursor already blinking
        // camera pivots on the URL; x/y bring that point to frame centre
        const px = f.left + 200, py = f.top + f.height / 2, cx = 960 - px, cy = 540 - py;
        gsap.set("#cam", { transformOrigin: `${px}px ${py}px` });
        tl.fromTo("#cam", { scale: 2.1, x: cx, y: cy }, { scale: 1.95, duration: 1.4, ease: "none" }, 0);
        gsap.set("#prog", { scaleX: 0 });
        const u = IK.chars(document.getElementById("url"), "rosas.be");
        IK.blink(tl, u.caret, 0, 0.4, 0.4);
        tl.set("#ph", { opacity: 0 }, 0.4);
        const last = IK.type(tl, u.cs, 0.42, 0.085);
        // 1.35 enter: load bar crawls, stalls, nothing
        tl.set(u.caret, { opacity: 0 }, 1.35);
        tl.to("#cam", { scale: 1, x: 0, y: 0, duration: 1.1, ease: E.io3 }, 1.4);
        tl.to("#prog", { scaleX: 0.62, duration: 1.0, ease: "power2.out" }, 1.4);
        tl.to("#prog", { opacity: 0, duration: 0.2 }, 2.4);
        tl.fromTo("#err", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: E.o3 }, 2.5);
        tl.to("#err", { opacity: 0, duration: 0.3 }, 3.55);
        // the line
        IK.rise(tl, ["#m1 > span", "#m2 > span"], 3.75, 0.55, 0.75);
        tl.to("#lines", { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, 5.6);
        // reload, then the address is taken: select-all, push in, flood
        tl.to("#reload", { rotation: 360, transformOrigin: "50% 50%", duration: 0.55, ease: E.io3 }, 5.9);
        tl.set("#prog", { scaleX: 0, opacity: 1 }, 5.9);
        tl.to("#prog", { scaleX: 1, duration: 0.6, ease: "power2.in" }, 5.95);
        tl.set("#prog", { opacity: 0 }, 6.55);
        tl.to("#cam", { scale: 2.2, x: cx, y: cy, duration: 1.3, ease: "power2.inOut" }, 6.3);
        tl.set(u.caret, { opacity: 1 }, 6.45);
        IK.select(tl, document.getElementById("urlSel"), 6.75);
        tl.set(u.caret, { opacity: 0 }, 6.95);
        tl.seek(7.55);
        const cr = u.caret.getBoundingClientRect();
        tl.seek(0);
        IK.flood(tl, document.getElementById("flood"), cr.left + cr.width / 2, cr.top + cr.height / 2, 7.58);

        IK.tail(tl);
        IK.done(tl);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
