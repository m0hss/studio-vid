<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Intro 5 — The 72-Hour Clock</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="_shared/intro.css" />
    <style>
      #s5 { background: radial-gradient(60% 50% at 50% 120%, rgba(20,184,166,0.22), rgba(15,118,110,0.06) 50%, transparent 75%), #000; }
      #cam { position: absolute; inset: 0; }
      #clock { position: absolute; left: 0; right: 0; top: 250px; display: flex; justify-content: center; font: 500 280px/1 var(--mono); color: var(--white); }
      #slots { position: relative; display: flex; }
      .slot { position: relative; width: 0.6em; height: 1.16em; overflow: hidden; }
      .reel { position: absolute; left: 0; top: 0; width: 100%; }
      .reel span, .scr span { display: block; height: 1.16em; line-height: 1.16em; text-align: center; }
      .colon .reel:not(.scr) { color: var(--glow-light); }
      .scr span { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
      #hl { position: absolute; top: 0.1em; bottom: 0.08em; background: var(--glow); transform-origin: 0 50%; }
      #ccaret { position: absolute; top: 0.2em; width: 12px; height: 0.78em; border-radius: 3px; background: var(--glow); box-shadow: 0 0 18px rgba(20,184,166,0.85); opacity: 0; }
      #lines { position: absolute; left: 0; right: 0; top: 690px; display: flex; flex-direction: column; align-items: center; }
      #lines .ln { font: 500 76px/1.08 var(--display); letter-spacing: -0.03em; color: var(--white); }
      #lines .t { color: var(--glow-light); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <section id="s5" class="clip" data-start="0" data-duration="8.1" data-track-index="1">
        <div id="cam">
          <div id="clock"><div id="slots"><div id="hl"></div></div></div>
          <div id="lines">
            <div class="ln" id="m1"><span>That's how long it takes</span></div>
            <div class="ln" id="m2"><span>to put <span class="t">your name</span> online.</span></div>
          </div>
        </div>
        <div class="flood" id="flood"></div>
      </section>
      <section id="tail" class="clip" data-start="7.98" data-duration="2.02" data-track-index="2"></section>
      <div id="grain"></div>
      <audio id="sfx" src="sfx.wav" data-start="0" data-duration="10" data-track-index="0" data-volume="1"></audio>
    </div>
    <script src="_shared/intro.js"></script>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const { E } = IK;
        // one value per second, then the scramble at 6.0
        const VALUES = ["72:00:00", "71:59:59", "71:59:58", "71:59:57", "71:59:56", "71:59:55"];
        const FINAL = " ROSA'S ";
        const slotsEl = document.getElementById("slots");
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const GLYPHS = "ABCDEFGHJKLMNOPRSTUVWXYZ0123456789#%&";

        const slots = [...VALUES[0]].map((_, i) => {
          const s = document.createElement("div"); s.className = "slot" + (VALUES[0][i] === ":" ? " colon" : "");
          // the reel lists each distinct value this slot shows, in order
          const seq = []; VALUES.forEach((v, k) => { if (!seq.length || seq[seq.length - 1].c !== v[i]) seq.push({ c: v[i], k }); });
          const reel = document.createElement("div"); reel.className = "reel";
          seq.forEach(({ c }) => { const sp = document.createElement("span"); sp.textContent = c; reel.appendChild(sp); });
          const scr = document.createElement("div"); scr.className = "scr reel";
          s.appendChild(reel); s.appendChild(scr); slotsEl.appendChild(s);
          return { s, reel, scr, seq };
        });

        // 0–6  the countdown; digits roll on each second
        tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.05, duration: 6, ease: "none", transformOrigin: "50% 40%" }, 0);
        slots.forEach(({ reel, seq }, i) => seq.forEach(({ k }, j) => {
          if (j) tl.to(reel, { yPercent: -100 * j / seq.length, duration: 0.32, ease: E.io3 }, k * 1.0 + i * 0.012);
        }));
        IK.rise(tl, ["#m1 > span", "#m2 > span"], 1.55, 0.5, 0.75);
        tl.to("#lines", { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, 5.3);
        tl.to("#clock", { y: 140, duration: 0.8, ease: E.io3 }, 5.4);

        // 6.0–6.75  every slot scrambles, then lands left to right on the name
        slots.forEach(({ reel, scr }, i) => {
          const t0 = 6.0 + i * 0.02, land = 6.3 + i * 0.065, fin = FINAL[i];
          const n = Math.round((land - t0) / 0.045);
          const spans = [];
          for (let k = 0; k <= n; k++) {
            const sp = document.createElement("span");
            sp.textContent = k === n ? fin : GLYPHS[Math.floor(rnd() * GLYPHS.length)];
            scr.appendChild(sp); spans.push(sp);
            tl.set(spans, { opacity: 0 }, t0 + k * 0.045);
            tl.set(sp, { opacity: 1 }, t0 + k * 0.045);
          }
          tl.set(reel, { opacity: 0 }, t0);
          if (fin === " ") tl.set(spans, { opacity: 0 }, land);
        });

        // the name gets a cursor, is selected, floods the frame
        const r1 = slots[1].s.getBoundingClientRect(), r6 = slots[6].s.getBoundingClientRect(), sl = slotsEl.getBoundingClientRect();
        gsap.set("#hl", { scaleX: 0, left: r1.left - sl.left - 6, width: r6.right - r1.left + 12 });
        const cc = document.createElement("div"); cc.id = "ccaret"; slotsEl.appendChild(cc);
        gsap.set(cc, { left: r6.right - sl.left + 4 });
        IK.blink(tl, cc, 6.8, 7.05, 0.25);
        tl.to("#hl", { scaleX: 1, duration: 0.16, ease: "power2.out" }, 7.05);
        tl.to(".scr", { color: "#000", duration: 0.06 }, 7.08);
        tl.set(cc, { opacity: 0 }, 7.2);
        tl.seek(7.5);
        const cr = cc.getBoundingClientRect();
        tl.seek(0);
        IK.flood(tl, document.getElementById("flood"), cr.left + cr.width / 2, cr.top + cr.height / 2, 7.58);

        IK.tail(tl);
        IK.done(tl);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
